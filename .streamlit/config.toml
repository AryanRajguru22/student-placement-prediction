[theme]
base = "light"
primaryColor = "#0F4C75"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D2733"
borderColor = "#D5DCE4"
font = "sans serif"

[client]
showErrorDetails = "none"      # uncaught errors show a generic message, never a stack trace or local file paths
toolbarMode = "minimal"

[server]
headless = true                # no first-run e-mail prompt. Local-only binding is applied by run_app.bat (--server.address localhost), so hosts can reach the app
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1               # the app has no uploads; keep the limit minimal

[browser]
gatherUsageStats = false
